name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-and-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python src/generate_data.py
      - run: python src/run_analysis.py
      - run: python -m pytest -q
